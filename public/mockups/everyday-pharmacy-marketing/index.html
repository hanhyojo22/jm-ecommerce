<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#081329">
    <title>Everyday Pharmacy · Golden Hour marketing concept</title>
    <script>document.documentElement.classList.add('booting');</script>
    <style>
        @font-face { font-family: Everyday; src: url('../everyday-pharmacy-splash/Inter.ttf') format('truetype'); font-weight: 100 900; font-display: swap; }
        * { box-sizing: border-box; }
        :root { color-scheme: dark; --navy: #081329; --blue: #071c94; --paper: #fafbfd; }
        html, body { margin: 0; min-height: 100%; }
        body { display: grid; min-height: 100svh; place-items: center; overflow: hidden; background: var(--navy); color: var(--blue); font-family: Everyday, sans-serif; -webkit-font-smoothing: antialiased; }
        ::selection { background: #ffe6a0; color: var(--navy); }
        .film { position: relative; width: min(100vw, 56.25svh); aspect-ratio: 9 / 16; overflow: hidden; isolation: isolate; container-type: size; background: var(--paper); }
        .booting .film { visibility: hidden; }
        .night, .day, .scene { position: absolute; inset: 0; }
        .night { background: radial-gradient(ellipse 70% 45% at 50% 41%, #233652 0, var(--navy) 78%); }
        .night::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 48% 28% at 48% 46%, rgb(255 195 66 / 27%), transparent 100%); }
        .day { background: radial-gradient(ellipse 55% 31% at 50% 40%, #fff9e9, var(--paper) 90%); }
        .intro { opacity: 0; }
        .intro-emblem { position: absolute; top: 30%; left: 12%; width: 72%; aspect-ratio: 1.12; }
        .emblem { position: relative; width: 76%; aspect-ratio: 1.12; margin: 0 auto 6cqw; }
        .sprite { position: absolute; aspect-ratio: 1; background-image: url('../everyday-pharmacy-splash/emblem-sprites.png'); background-repeat: no-repeat; background-size: 200% 100%; }
        .sun { top: 0; left: -3%; width: 88%; background-position: left center; }
        .cloud { top: 16%; left: 8%; width: 108%; background-position: right center; }
        .intro .cloud::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 32%, rgb(255 255 255 / 55%) 48%, transparent 64%); background-size: 320% 100%; background-position: 100% 50%; mask-image: url('../everyday-pharmacy-splash/emblem-sprites.png'); mask-size: 200% 100%; mask-position: right center; mask-repeat: no-repeat; }
        .app-scene { opacity: 0; }
        .app-copy { position: absolute; top: 9.5%; left: 9%; right: 7%; }
        .app-copy h2 { margin: 0; color: var(--navy); font-size: 8cqw; font-weight: 740; line-height: 1.07; letter-spacing: -.035em; }
        .app-copy p { margin: 4cqw 0 0; color: #53617b; font-size: 3.1cqw; font-weight: 450; line-height: 1.5; }
        .phone { position: absolute; top: 32%; left: 22%; width: 57%; aspect-ratio: 9 / 17.5; padding: 1cqw; border-radius: 6.4cqw; background: #172130; box-shadow: 3cqw 5cqw 8cqw rgb(14 31 52 / 22%); transform: perspective(1100px) rotateY(-10deg) rotateZ(-4deg); }
        .screen { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 5.5cqw; background: #f3f5f2; }
        .screen img { display: block; width: 100%; height: auto; transform: translateY(-3.4%); }
        .phone::after { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, rgb(255 255 255 / 17%), transparent 37%); content: ''; pointer-events: none; }
        .ending { display: grid; place-items: center; }
        .brand { width: 78%; margin-top: -6%; text-align: center; }
        .wordmark { margin: 0; color: var(--blue); font-size: 8.8cqw; font-weight: 850; line-height: 1.06; letter-spacing: -.035em; }
        .wordmark span { display: block; }
        .wordmark span + span { margin-top: .7cqw; }
        .closing-copy { position: absolute; bottom: 16%; left: 0; width: 100%; margin: 0; color: #53617b; text-align: center; font-size: 3.1cqw; font-weight: 450; letter-spacing: .01em; }
        .replay { position: fixed; z-index: 10; bottom: 14px; left: 50%; display: inline-flex; min-height: 44px; align-items: center; gap: 8px; padding: 0 16px; border: 1px solid #d9e0ed; border-radius: 8px; background: #fff; color: #34445f; font: 500 12px Everyday, sans-serif; cursor: pointer; transform: translateX(-50%); }
        .replay:hover { background: #eef2f8; }
        .replay:focus-visible { outline: 2px solid #ffc94f; outline-offset: 3px; }
        .capture .replay { display: none; }
        .play .day { animation: daybreak 10s cubic-bezier(.22, 1, .36, 1) both; }
        .play .intro { animation: intro-visibility 10s linear both; }
        .play .intro-emblem { animation: camera-arrival 10s cubic-bezier(.16, 1, .3, 1) both; }
        .play .intro .sun { animation: golden-sun 2.1s cubic-bezier(.22, 1, .36, 1) both; }
        .play .intro .cloud { animation: cloud-pass 1.6s cubic-bezier(.16, 1, .3, 1) .2s both; }
        .play .intro .cloud::after { animation: passing-light 1.25s ease-in-out .9s both; }
        .play .app-scene { animation: app-visibility 10s ease both; }
        .play .app-copy { animation: copy-arrival 10s cubic-bezier(.16, 1, .3, 1) both; }
        .play .phone { animation: product-camera 10s cubic-bezier(.16, 1, .3, 1) both; }
        .play .ending { animation: ending-visibility 10s ease both; }
        .play .ending .emblem { animation: final-emblem 10s cubic-bezier(.16, 1, .3, 1) both; }
        .play .wordmark { animation: final-type 10s ease both; }
        .play .closing-copy { animation: final-copy 10s ease both; }
        @keyframes daybreak { 0%, 17% { clip-path: circle(0% at 49% 44%); } 32%, 100% { clip-path: circle(150% at 49% 44%); } }
        @keyframes intro-visibility { 0% { opacity: 0; } 6%, 23% { opacity: 1; } 30%, 100% { opacity: 0; } }
        @keyframes camera-arrival { 0% { transform: scale(1.5) translateY(5%); filter: blur(4px); } 22%, 100% { transform: scale(1) translateY(0); filter: blur(0); } }
        @keyframes golden-sun { from { transform: translate(5%, 25%) rotate(-14deg) scale(.9); } to { transform: translate(0, 0) rotate(0) scale(1); } }
        @keyframes cloud-pass { from { opacity: 0; transform: translateX(15%); } to { opacity: 1; transform: translateX(0); } }
        @keyframes passing-light { from { background-position: 100% 50%; } to { background-position: -100% 50%; } }
        @keyframes app-visibility { 0%, 25% { opacity: 0; } 32%, 56% { opacity: 1; } 64%, 100% { opacity: 0; } }
        @keyframes copy-arrival { 0%, 25% { transform: translateY(18px); } 34%, 100% { transform: translateY(0); } }
        @keyframes product-camera { 0%, 25% { transform: perspective(1100px) translateY(22%) rotateY(-18deg) rotateZ(-7deg) scale(.9); } 36% { transform: perspective(1100px) translateY(0) rotateY(-10deg) rotateZ(-4deg) scale(1); } 55% { transform: perspective(1100px) translateY(-2%) rotateY(-4deg) rotateZ(-2deg) scale(1.025); } 65%, 100% { transform: perspective(1100px) translateY(10%) rotateY(0deg) rotateZ(0deg) scale(.94); } }
        @keyframes ending-visibility { 0%, 59% { opacity: 0; } 69%, 100% { opacity: 1; } }
        @keyframes final-emblem { 0%, 59% { transform: scale(.91) translateY(12px); } 72%, 100% { transform: scale(1) translateY(0); } }
        @keyframes final-type { 0%, 63% { opacity: 0; filter: blur(5px); transform: translateY(8px); } 79%, 100% { opacity: 1; filter: blur(0); transform: translateY(0); } }
        @keyframes final-copy { 0%, 73% { opacity: 0; } 84%, 100% { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            .play *, .play *::after { animation: none !important; }
            .play .day { clip-path: none; }
            .play .intro, .play .app-scene { opacity: 0; }
            .play .ending, .play .wordmark, .play .closing-copy { opacity: 1; filter: none; transform: none; }
        }
    </style>
</head>
<body>
    <main class="film" aria-label="Everyday Pharmacy marketing animation concept">
        <div class="night" aria-hidden="true"></div>
        <div class="day" aria-hidden="true"></div>
        <div class="scene intro" aria-hidden="true">
            <div class="intro-emblem"><div class="sprite sun"></div><div class="sprite cloud"></div></div>
        </div>
        <section class="scene app-scene" aria-label="App preview">
            <div class="app-copy"><h2>Your branch.<br>In your pocket.</h2><p>Browse medicines. Place an order.</p></div>
            <div class="phone"><div class="screen"><img src="app-preview.png" alt="The app showing pharmacy branches, medicines, orders, and the shopping cart"></div></div>
        </section>
        <section class="scene ending" aria-label="Everyday Pharmacy">
            <div class="brand">
                <div class="emblem" aria-hidden="true"><div class="sprite sun"></div><div class="sprite cloud"></div></div>
                <h1 class="wordmark"><span>EVERYDAY</span><span>PHARMACY</span></h1>
            </div>
            <p class="closing-copy">Discover the app.</p>
        </section>
    </main>
    <button type="button" class="replay" aria-label="Replay marketing animation"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg>Replay film</button>
    <script>
        const params = new URLSearchParams(location.search);
        if (params.has('capture')) document.body.classList.add('capture');
        const ready = Promise.all([
            document.fonts.ready,
            ...['../everyday-pharmacy-splash/emblem-sprites.png', 'app-preview.png'].map(src => {
                const image = new Image(); image.src = src; return image.decode();
            }),
        ]);
        const play = async () => {
            await ready;
            document.body.classList.remove('play');
            void document.body.offsetWidth;
            document.body.classList.add('play');
            document.documentElement.classList.remove('booting');
        };
        document.querySelector('.replay').addEventListener('click', play);
        document.addEventListener('visibilitychange', () => {
            for (const animation of document.getAnimations()) {
                if (document.hidden && animation.playState === 'running') animation.pause();
                else if (!document.hidden && animation.playState === 'paused') animation.play();
            }
        });
        if (params.has('still')) ready.then(() => document.documentElement.classList.remove('booting'));
        else play();
    </script>
</body>
</html>
