envVarGroups:
  - name: jmmart-reverb-credentials
    envVars:
      - key: REVERB_APP_ID
        value: jmmart
      - key: REVERB_APP_KEY
        value: d4258d9d1bdd4fbd09df58dc182cba0e84359788001b076d
      - key: REVERB_APP_SECRET
        generateValue: true

services:
  - type: web
    name: jmmart-marketplace
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: "80"
      - key: APP_NAME
        value: JMMart
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          name: jmmart-marketplace
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: reverb
      - fromGroup: jmmart-reverb-credentials
      - key: REVERB_HOST
        value: jmmart-chat-reverb.onrender.com
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: https
      - key: REVERB_ALLOWED_ORIGINS
        value: jmmart-marketplace.onrender.com
      - key: FILESYSTEM_DISK
        value: public
      - key: NEON_PRODUCT_IMAGES_BUCKET
        value: product-images
      - key: CHAT_ATTACHMENTS_BUCKET
        value: uploads
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        fromService:
          name: jmmart-marketplace
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: log
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_FROM_ADDRESS
        value: itservices@jmsolutionitservices.com

  - type: web
    name: jmmart-chat-reverb
    runtime: docker
    dockerCommand: php artisan reverb:start --host=0.0.0.0 --port=10000
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_NAME
        value: JMMart
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        fromService:
          name: jmmart-marketplace
          type: web
          envVarKey: APP_KEY
      - key: APP_URL
        fromService:
          name: jmmart-marketplace
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: RUN_MIGRATIONS
        value: "false"
      - key: RUN_OPTIMIZATIONS
        value: "false"
      - key: CACHE_STORE
        value: file
      - key: BROADCAST_CONNECTION
        value: log
      - key: REVERB_HOST
        value: jmmart-chat-reverb.onrender.com
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: https
      - key: REVERB_SERVER_HOST
        value: 0.0.0.0
      - key: REVERB_SERVER_PORT
        value: "10000"
      - key: REVERB_ALLOWED_ORIGINS
        value: jmmart-marketplace.onrender.com
      - fromGroup: jmmart-reverb-credentials
      - key: LOG_CHANNEL
        value: stderr
