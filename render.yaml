services:
  - type: web
    name: jmmart-marketplace
    runtime: docker
    plan: free
    region: singapore
    dockerCommand: sh -c 'php artisan migrate --force --no-interaction && apache2-foreground'
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: "80"
      - key: APP_NAME
        value: JMMart
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          name: jmmart-marketplace
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: public
      - key: NEON_PRODUCT_IMAGES_BUCKET
        value: product-images
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        fromService:
          name: jmmart-marketplace
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: log
