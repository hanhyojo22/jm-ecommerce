<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handoff mockup C — The quiet threshold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --ink: #fff;
        --muted-on-navy: #b3c6e2;
        --dim-on-navy: #8fa6cb;
        --brand-on-navy: #9fc0ff;
    }

    html, body { min-height: 100%; }

    body {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background: #10234d;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
    }

    a { color: inherit; text-decoration: none; }

    .shell {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        overflow: hidden;
        background: linear-gradient(158deg, #163a86 0%, #10234d 58%, #0b1a3c 100%);
    }

    .shell::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(60% 46% at 50% -10%, rgb(59 130 246 / 30%), transparent 70%),
            radial-gradient(50% 40% at 6% 108%, rgb(29 78 216 / 26%), transparent 72%);
    }

    header { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 28px 48px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
    .mark-tile { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: #fff; color: #10234d; font-size: 13px; font-weight: 600; }

    main { position: relative; z-index: 1; display: flex; flex: 1; align-items: center; justify-content: center; padding: 40px 24px 64px; }

    .block { width: 100%; max-width: 620px; text-align: center; }

    h1 { font-size: clamp(30px, 4.2vw, 48px); font-weight: 600; line-height: 1.05; letter-spacing: -.035em; text-wrap: balance; }
    .lede { margin: 14px auto 0; max-width: 44ch; font-size: 15px; line-height: 1.6; color: var(--muted-on-navy); }

    /* ---------- one hand-off rail, laid out flat ---------- */
    .steps {
        position: relative;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 52px 0 0;
        padding: 0;
        list-style: none;
    }

    .steps::before,
    .steps::after {
        content: "";
        position: absolute;
        top: 11px;
        height: 2px;
        border-radius: 999px;
    }
    .steps::before { left: 16.6%; right: 16.6%; background: rgb(255 255 255 / 16%); }
    .steps::after { left: 16.6%; width: 33.4%; background: rgb(255 255 255 / 62%); }

    .step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; }

    .dot {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid rgb(255 255 255 / 28%);
        background: #10234d;
        color: transparent;
    }
    .dot svg { width: 13px; height: 13px; }

    .step.done .dot { border-color: transparent; background: #fff; color: #10234d; }

    .step.active .dot {
        border-color: transparent;
        background: conic-gradient(#fff 0deg 96deg, rgb(255 255 255 / 22%) 96deg 360deg);
        animation: spin 1.1s linear infinite;
    }
    .step.active .dot::after { content: ""; width: 15px; height: 15px; border-radius: 50%; background: #10234d; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .label { font-size: 13px; line-height: 1.4; color: var(--dim-on-navy); }
    .step.done .label { color: rgb(255 255 255 / 72%); }
    .step.active .label { color: #fff; font-weight: 600; }

    .note { margin: 40px auto 0; max-width: 40ch; font-size: 13px; line-height: 1.6; color: var(--dim-on-navy); }

    .restart {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        margin-top: 14px;
        font-size: 14px;
        font-weight: 500;
        color: var(--muted-on-navy);
        text-decoration: underline;
        text-decoration-color: rgb(255 255 255 / 25%);
        text-underline-offset: 4px;
    }
    .restart:hover { color: #fff; text-decoration-color: rgb(255 255 255 / 60%); }

    footer { position: relative; z-index: 1; padding: 0 48px 32px; text-align: center; font-size: 12px; color: var(--dim-on-navy); }

    @media (max-width: 640px) {
        header { padding: 20px 18px; }
        main { padding: 32px 18px 48px; }
        .steps { margin-top: 40px; gap: 6px; }
        .label { font-size: 12px; }
        footer { padding: 0 18px 26px; }
    }
</style>
</head>
<body>
    <div class="shell">
        <header>
            <a class="brand" href="#" aria-label="JMMart marketplace home">
                <span class="mark-tile" aria-hidden="true">JM</span>
                JMMart
            </a>
        </header>

        <main>
            <div class="block">
                <h1>Finishing your sign-in</h1>
                <p class="lede">Confirming your account with Clerk…</p>

                <ol class="steps">
                    <li class="step done">
                        <span class="dot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7"/></svg></span>
                        <span class="label">Check sign-in</span>
                    </li>
                    <li class="step active">
                        <span class="dot" aria-hidden="true"></span>
                        <span class="label">Confirm account</span>
                    </li>
                    <li class="step pending">
                        <span class="dot" aria-hidden="true"></span>
                        <span class="label">Secure session</span>
                    </li>
                </ol>

                <p class="note">You’ll be back in the marketplace in a moment. Nothing is charged or changed while you wait.</p>

                <a class="restart" href="#">Taking longer than expected? Sign in again</a>
            </div>
        </main>

        <footer>&copy; 2026 JMMart</footer>
    </div>
</body>
</html>
