<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Everyday Pharmacy — Flutter Homepage Redesign Mockup</title>
  <style>
    @font-face {
      font-family: 'Manrope';
      src: url('../mobile/assets/fonts/Manrope-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Manrope';
      src: url('../mobile/assets/fonts/Manrope-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Manrope';
      src: url('../mobile/assets/fonts/Manrope-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Manrope';
      src: url('../mobile/assets/fonts/Manrope-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Manrope';
      src: url('../mobile/assets/fonts/Manrope-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --studio-bg: #0b1120;
      --studio-surface: #111827;
      --studio-surface-2: #182235;
      --studio-border: #223049;
      --studio-fg: #f8fafc;
      --studio-muted: #94a3b8;
      --studio-accent: #3b82f6;
      --studio-gold: #ffc82c;
      --studio-green: #10b981;
      --studio-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 18% 0%, #16223d 0%, var(--studio-bg) 52%);
      color: var(--studio-fg);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    button, input {
      font-family: inherit;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    /* Studio Shell Layout */
    .studio-shell {
      max-width: 1360px;
      margin: 0 auto;
      padding: 18px 20px 36px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .control-deck {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--studio-border);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .deck-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .deck-title-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .deck-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .deck-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 200, 44, 0.14);
      color: var(--studio-gold);
      border: 1px solid rgba(255, 200, 44, 0.28);
    }

    .deck-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .deck-subtitle {
      margin: 0;
      font-size: 12.5px;
      color: var(--studio-muted);
    }

    .layout-segmented {
      display: inline-flex;
      padding: 3px;
      border-radius: 10px;
      background: var(--studio-bg);
      border: 1px solid var(--studio-border);
      gap: 3px;
    }

    .seg-btn {
      border: 0;
      background: transparent;
      color: var(--studio-muted);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.16s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .seg-btn.active {
      background: #1e3a8a;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(30, 58, 138, 0.4);
    }

    .seg-btn:hover:not(.active) {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    /* Direction Switcher */
    .direction-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    @media (max-width: 980px) {
      .direction-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .direction-grid {
        grid-template-columns: 1fr;
      }
    }

    .dir-btn {
      text-align: left;
      background: rgba(15, 23, 42, 0.7);
      border: 1.5px solid var(--studio-border);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--studio-fg);
      cursor: pointer;
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dir-btn:hover {
      border-color: #475569;
      background: rgba(30, 41, 59, 0.72);
    }

    .dir-btn.active {
      border-color: var(--studio-gold);
      background: rgba(30, 58, 138, 0.28);
      box-shadow: 0 0 0 1px rgba(255, 200, 44, 0.28), 0 8px 20px rgba(0, 0, 0, 0.24);
    }

    .dir-btn-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .dir-btn-title {
      font-size: 12.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .dir-swatch {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .dir-tag {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .tag-rec {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .tag-alt {
      background: rgba(59, 130, 246, 0.14);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.28);
    }

    .tag-warn {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.28);
    }

    .dir-desc {
      margin: 0;
      font-size: 11px;
      line-height: 1.38;
      color: var(--studio-muted);
    }

    /* Controls Bar */
    .deck-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--studio-border);
    }

    .scrubber-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 260px;
      font-size: 12px;
    }

    .scrubber-group label {
      font-weight: 700;
      color: var(--studio-muted);
      white-space: nowrap;
    }

    .scrubber-group input[type="range"] {
      width: 170px;
      accent-color: var(--studio-gold);
      cursor: pointer;
    }

    .collapse-pct {
      min-width: 38px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
    }

    .preset-pills {
      display: inline-flex;
      gap: 4px;
    }

    .ctrl-pill {
      border: 1px solid var(--studio-border);
      background: var(--studio-bg);
      color: #e2e8f0;
      font-size: 11.5px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .ctrl-pill:hover {
      background: var(--studio-surface-2);
      border-color: #475569;
    }

    .ctrl-pill.active {
      background: #1d4ed8;
      border-color: #3b82f6;
      color: #ffffff;
    }

    .ctrl-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Stage Workspace */
    .stage-workspace {
      display: grid;
      grid-template-columns: auto minmax(340px, 1fr);
      gap: 24px;
      align-items: start;
      justify-content: center;
    }

    .stage-workspace.compare-mode {
      grid-template-columns: 1fr;
    }

    @media (max-width: 960px) {
      .stage-workspace {
        grid-template-columns: 1fr;
        justify-items: center;
      }
    }

    .phones-cluster {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }

    .phone-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .phone-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 390px;
      padding: 0 4px;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
    }

    .caption-chip {
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(15, 61, 158, 0.45);
      color: #bfdbfe;
      border: 1px solid rgba(96, 165, 250, 0.35);
    }

    .caption-chip.before {
      background: rgba(245, 158, 11, 0.16);
      color: #fcd34d;
      border-color: rgba(245, 158, 11, 0.32);
    }

    /* Realistic 390x844 Phone Shell */
    .phone-bezel {
      width: 406px;
      height: 860px;
      padding: 8px;
      border-radius: 44px;
      background: linear-gradient(145deg, #27344f 0%, #0f172a 100%);
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.55),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      position: relative;
      flex-shrink: 0;
    }

    .phone-screen {
      /* Default Option A Light tokens */
      --p-header-bg: #0f3d9e;
      --p-header-ink: #ffffff;
      --p-header-sub: rgba(255, 255, 255, 0.82);
      --p-strip-bg: rgba(255, 255, 255, 0.14);
      --p-strip-border: rgba(255, 255, 255, 0.22);
      --p-strip-ink: #ffffff;
      --p-strip-muted: rgba(255, 255, 255, 0.84);
      --p-open-color: #6ee7b7;
      --p-open-dot: #34d399;
      --p-primary: #0f3d9e;
      --p-on-primary: #ffffff;
      --p-primary-soft: #e8effd;
      --p-gold: #ffc82c;
      --p-gold-ink: #0d1f4f;
      --p-teal: #0f766e;
      --p-teal-soft: #e6f6f4;
      --p-canvas: #f5f6f9;
      --p-card: #ffffff;
      --p-card-border: #e4e8f2;
      --p-card-shadow: 0 2px 10px rgba(15, 29, 64, 0.055);
      --p-ink: #0d1f4f;
      --p-muted: #52607a;
      --p-rx-bg: #eef2ff;
      --p-rx-fg: #3730a3;
      --p-sale: #dc2626;
      --p-deals-band: #ebf1ff;
      --p-deals-border: #dbe6fe;
      --p-hero-bg: #0f3d9e;
      --p-hero-ink: #ffffff;
      --p-hero-eyebrow-bg: rgba(255, 255, 255, 0.15);
      --p-hero-eyebrow-fg: #ffffff;
      --p-nav-bg: #ffffff;
      --p-nav-border: #e4e8f2;
      --p-nav-pill: #e8effd;
      --p-nav-active: #0f3d9e;
      --p-search-bg: #ffffff;
      --p-search-border: rgba(15, 61, 158, 0.12);
      --p-search-shadow: 0 6px 16px rgba(9, 25, 71, 0.22);
      --p-card-radius: 12px;
      --p-btn-bg: #e8effd;
      --p-btn-fg: #0f3d9e;
      --p-btn-active-bg: #0f3d9e;
      --p-btn-active-fg: #ffffff;
      --p-cat-bg-rx: #eef2ff;
      --p-cat-bg-pain: #fff1f2;
      --p-cat-bg-cough: #e0f2fe;
      --p-cat-bg-vit: #fef3c7;
      --p-cat-bg-aid: #e6f6f4;

      width: 390px;
      height: 844px;
      border-radius: 36px;
      overflow: hidden;
      background: var(--p-canvas);
      color: var(--p-ink);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background-color 0.22s ease, color 0.22s ease;
    }

    /* Option B: Modern Care Teal & Sun Gold */
    .phone-screen[data-option="b"] {
      --p-header-bg: #0b5d56;
      --p-header-ink: #ffffff;
      --p-header-sub: rgba(255, 255, 255, 0.84);
      --p-strip-bg: rgba(255, 255, 255, 0.14);
      --p-strip-border: rgba(255, 255, 255, 0.24);
      --p-strip-ink: #ffffff;
      --p-strip-muted: rgba(255, 255, 255, 0.86);
      --p-open-color: #fde68a;
      --p-open-dot: #ffc82c;
      --p-primary: #0d7a70;
      --p-on-primary: #ffffff;
      --p-primary-soft: #e6f4f1;
      --p-gold: #ffc82c;
      --p-gold-ink: #0c2320;
      --p-teal: #0b5d56;
      --p-teal-soft: #e6f4f1;
      --p-canvas: #f7f7f4;
      --p-card: #ffffff;
      --p-card-border: #e5e7e2;
      --p-card-shadow: 0 2px 10px rgba(12, 35, 32, 0.055);
      --p-ink: #0c2320;
      --p-muted: #4f6360;
      --p-deals-band: #e6f4f1;
      --p-deals-border: #cde9e2;
      --p-hero-bg: #0b5d56;
      --p-nav-pill: #e6f4f1;
      --p-nav-active: #0b5d56;
      --p-search-border: rgba(11, 93, 86, 0.14);
      --p-search-shadow: 0 6px 16px rgba(7, 46, 42, 0.22);
      --p-btn-bg: #e6f4f1;
      --p-btn-fg: #0b5d56;
      --p-btn-active-bg: #0b5d56;
      --p-btn-active-fg: #ffffff;
    }

    /* Option C: Crisp Daylight */
    .phone-screen[data-option="c"] {
      --p-header-bg: #d6e8ff;
      --p-header-ink: #0d1f4f;
      --p-header-sub: #334e86;
      --p-strip-bg: rgba(255, 255, 255, 0.92);
      --p-strip-border: rgba(15, 61, 158, 0.14);
      --p-strip-ink: #0d1f4f;
      --p-strip-muted: #52607a;
      --p-open-color: #0f766e;
      --p-open-dot: #0f766e;
      --p-primary: #0f3d9e;
      --p-on-primary: #ffffff;
      --p-primary-soft: #e8effd;
      --p-gold: #ffc82c;
      --p-gold-ink: #0d1f4f;
      --p-canvas: #f5f6f9;
      --p-card: #ffffff;
      --p-card-border: #e4e8f2;
      --p-card-shadow: 0 2px 10px rgba(15, 29, 64, 0.055);
      --p-ink: #0d1f4f;
      --p-muted: #52607a;
      --p-deals-band: #eef3ff;
      --p-deals-border: #dbe6fe;
      --p-hero-bg: #0f3d9e;
      --p-nav-pill: #e8effd;
      --p-nav-active: #0f3d9e;
      --p-search-border: rgba(15, 61, 158, 0.16);
      --p-search-shadow: 0 4px 14px rgba(15, 61, 158, 0.12);
    }

    /* Dark Mode Overrides */
    .phone-screen.is-dark[data-option="a"],
    .phone-screen.is-dark[data-option="c"] {
      --p-header-bg: #112254;
      --p-header-ink: #f8fafc;
      --p-header-sub: #c7d5f8;
      --p-strip-bg: rgba(11, 16, 32, 0.45);
      --p-strip-border: rgba(122, 162, 255, 0.25);
      --p-strip-ink: #f8fafc;
      --p-strip-muted: #b6c4e2;
      --p-open-color: #6ee7b7;
      --p-open-dot: #34d399;
      --p-primary: #7aa2ff;
      --p-on-primary: #0b132b;
      --p-primary-soft: #1b2a52;
      --p-gold: #ffc82c;
      --p-gold-ink: #0d1f4f;
      --p-teal: #5eead4;
      --p-teal-soft: #123635;
      --p-canvas: #0b1020;
      --p-card: #131b30;
      --p-card-border: #243052;
      --p-card-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      --p-ink: #f1f5f9;
      --p-muted: #9aa9c7;
      --p-rx-bg: #1e2859;
      --p-rx-fg: #c7d2fe;
      --p-sale: #f87171;
      --p-deals-band: #111b36;
      --p-deals-border: #223159;
      --p-hero-bg: #142a6b;
      --p-nav-bg: #10172b;
      --p-nav-border: #222e4f;
      --p-nav-pill: #1b2b58;
      --p-nav-active: #7aa2ff;
      --p-search-bg: #16203a;
      --p-search-border: #2b3a63;
      --p-search-shadow: 0 6px 16px rgba(0, 0, 0, 0.38);
      --p-btn-bg: #1d2c54;
      --p-btn-fg: #9ec0ff;
      --p-btn-active-bg: #7aa2ff;
      --p-btn-active-fg: #0b132b;
      --p-cat-bg-rx: #1b254a;
      --p-cat-bg-pain: #331c28;
      --p-cat-bg-cough: #152b3f;
      --p-cat-bg-vit: #322814;
      --p-cat-bg-aid: #14302d;
    }

    .phone-screen.is-dark[data-option="b"] {
      --p-header-bg: #0a3d39;
      --p-header-ink: #f8fafc;
      --p-header-sub: #b5e3de;
      --p-strip-bg: rgba(10, 20, 19, 0.45);
      --p-strip-border: rgba(79, 209, 197, 0.26);
      --p-strip-ink: #f8fafc;
      --p-strip-muted: #a7c7c3;
      --p-open-color: #fde68a;
      --p-open-dot: #ffc82c;
      --p-primary: #4fd1c5;
      --p-on-primary: #062825;
      --p-primary-soft: #133532;
      --p-gold: #ffc82c;
      --p-gold-ink: #0c2320;
      --p-teal: #4fd1c5;
      --p-teal-soft: #133532;
      --p-canvas: #0a1413;
      --p-card: #11201e;
      --p-card-border: #203835;
      --p-card-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      --p-ink: #eff7f6;
      --p-muted: #95b3af;
      --p-rx-bg: #1e2859;
      --p-rx-fg: #c7d2fe;
      --p-sale: #f87171;
      --p-deals-band: #0e2623;
      --p-deals-border: #1d423d;
      --p-hero-bg: #0d4a44;
      --p-nav-bg: #0e1a18;
      --p-nav-border: #1f3532;
      --p-nav-pill: #143834;
      --p-nav-active: #4fd1c5;
      --p-search-bg: #142624;
      --p-search-border: #264541;
      --p-search-shadow: 0 6px 16px rgba(0, 0, 0, 0.38);
      --p-btn-bg: #143632;
      --p-btn-fg: #6ee7dc;
      --p-btn-active-bg: #4fd1c5;
      --p-btn-active-fg: #062825;
      --p-cat-bg-rx: #1b254a;
      --p-cat-bg-pain: #331c28;
      --p-cat-bg-cough: #152b3f;
      --p-cat-bg-vit: #322814;
      --p-cat-bg-aid: #14302d;
    }

    /* Current (Before) Faithful Reproduction */
    .phone-screen[data-option="before"] {
      --p-header-bg: #e4f2fd;
      --p-header-ink: #000b88;
      --p-header-sub: #000b88;
      --p-primary: #000b88;
      --p-on-primary: #ffffff;
      --p-primary-soft: #e4f2fd;
      --p-gold: #f8bf0b;
      --p-canvas: #f4f8fc;
      --p-card: #ffffff;
      --p-card-border: #dce2ee;
      --p-card-shadow: none;
      --p-ink: #111a33;
      --p-muted: #525d78;
      --p-rx-bg: #9a5b00;
      --p-rx-fg: #ffffff;
      --p-sale: #ba1a1a;
      --p-nav-bg: #ffffff;
      --p-nav-border: #dce2ee;
      --p-nav-pill: #fff4d1;
      --p-nav-active: #000b88;
      --p-search-bg: #ffffff;
      --p-search-border: rgba(0, 11, 136, 0.14);
      --p-search-shadow: 0 2px 10px rgba(0, 11, 136, 0.07);
    }

    /* Touch Target Inspector Overlay */
    .touch-debug [data-touch="true"] {
      outline: 1.5px dashed #10b981 !important;
      outline-offset: -1.5px;
      position: relative;
    }
    .touch-debug [data-touch="true"]::after {
      content: attr(data-size);
      position: absolute;
      top: 1px;
      right: 1px;
      background: #059669;
      color: #ffffff;
      font-size: 8px;
      font-weight: 800;
      line-height: 1;
      padding: 2px 3px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 40;
      font-family: ui-monospace, monospace;
    }
    .touch-debug [data-touch-bad="true"] {
      outline-color: #ef4444 !important;
    }
    .touch-debug [data-touch-bad="true"]::after {
      background: #dc2626 !important;
    }

    /* Phone Status Bar */
    .phone-status {
      height: 28px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--p-header-bg);
      color: var(--p-header-ink);
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      transition: background-color 0.22s ease, color 0.22s ease;
    }

    .status-icons {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
    }

    /* Phone Collapsible Header */
    .shop-header {
      background: var(--p-header-bg);
      color: var(--p-header-ink);
      padding: 4px 16px 12px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      flex-shrink: 0;
      position: relative;
      z-index: 20;
      transition: background-color 0.22s ease, border-radius 0.16s ease, padding 0.16s ease;
    }

    .shop-header.flat-bottom {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      padding-bottom: 8px;
    }

    .header-expandable {
      overflow: hidden;
      transition: opacity 0.12s linear;
    }

    .branch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 44px;
    }

    .branch-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 0;
      padding: 4px 2px;
      color: var(--p-header-ink);
      cursor: pointer;
      min-height: 44px;
      text-align: left;
      flex: 1;
      min-width: 0;
    }

    .branch-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .branch-name {
      font-size: 17.5px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .branch-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--p-header-sub);
      opacity: 0.92;
      margin-top: 1px;
    }

    /* Unified Brand Emblem Badge (Redesign) */
    .unified-emblem {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px 4px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      flex-shrink: 0;
    }

    .phone-screen[data-option="c"]:not(.is-dark) .unified-emblem {
      background: rgba(255, 255, 255, 0.78);
      border-color: rgba(15, 61, 158, 0.15);
    }

    .emblem-stack {
      position: relative;
      width: 28px;
      height: 22px;
      flex-shrink: 0;
    }

    .emblem-sun-slice {
      position: absolute;
      left: 0;
      top: 0;
      width: 18px;
      height: 18px;
      overflow: hidden;
    }

    .emblem-sun-slice img {
      width: 36px;
      height: 18px;
      max-width: none;
      object-fit: cover;
      object-position: left center;
      display: block;
    }

    .emblem-cloud-slice {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 21px;
      height: 16px;
      overflow: hidden;
    }

    .emblem-cloud-slice img {
      width: 42px;
      height: 16px;
      max-width: none;
      margin-left: -21px;
      object-fit: cover;
      display: block;
    }

    .emblem-brand-txt {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.05;
      color: var(--p-header-ink);
    }

    /* Compact Branch Status Strip (Redesign) */
    .compact-status-strip {
      margin: 4px 0 8px;
      height: 34px;
      border-radius: 10px;
      background: var(--p-strip-bg);
      border: 1px solid var(--p-strip-border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--p-strip-ink);
    }

    .strip-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .strip-divider {
      width: 1px;
      height: 14px;
      background: var(--p-strip-border);
      flex-shrink: 0;
    }

    .strip-muted {
      font-weight: 600;
      color: var(--p-strip-muted);
    }

    /* Before Header Forecast Tiles */
    .before-forecast-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: 54px;
      margin: 6px 0 8px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(0, 11, 136, 0.1);
      border-radius: 14px;
      overflow: hidden;
    }

    .before-tile {
      padding: 5px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid #dce2ee;
    }

    .before-tile:last-child {
      border-right: 0;
    }

    .before-tile-top {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 800;
      color: #000b88;
    }

    .before-tile-sub {
      font-size: 10.5px;
      font-weight: 500;
      color: #525d78;
      margin-top: 1px;
    }

    /* Search Bar */
    .search-pill {
      height: 48px;
      width: 100%;
      border-radius: 999px;
      background: var(--p-search-bg);
      border: 1px solid var(--p-search-border);
      box-shadow: var(--p-search-shadow);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      cursor: pointer;
      color: var(--p-muted);
      font-size: 14px;
      font-weight: 500;
      text-align: left;
    }

    .search-pill-badge {
      margin-left: auto;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--p-primary-soft);
      color: var(--p-primary);
    }

    /* Docked Category Pills (visible when collapsed) */
    .docked-pills-bar {
      background: var(--p-header-bg);
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      padding: 2px 14px 10px;
      display: none;
      gap: 7px;
      overflow-x: auto;
      flex-shrink: 0;
      box-shadow: 0 6px 14px rgba(10, 22, 58, 0.14);
      z-index: 19;
    }

    .docked-pills-bar.visible {
      display: flex;
    }

    .docked-pills-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-pill-chip {
      height: 40px;
      padding: 0 12px 0 5px;
      border-radius: 999px;
      background: var(--p-card);
      color: var(--p-ink);
      border: 1px solid var(--p-card-border);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cat-pill-chip.active {
      background: var(--p-gold);
      color: var(--p-gold-ink);
      border-color: transparent;
      font-weight: 800;
    }

    .cat-pill-thumb {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--p-primary-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 3px;
    }

    .cat-pill-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Phone Scroll Feed */
    .phone-feed {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 18px;
      scroll-behavior: auto;
    }

    .phone-feed::-webkit-scrollbar {
      width: 3px;
    }

    .phone-feed::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.25);
      border-radius: 999px;
    }

    /* Quick Actions Row */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 8px 16px 2px;
    }

    .quick-btn {
      background: transparent;
      border: 0;
      padding: 2px;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--p-ink);
    }

    .quick-icon-disc {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--p-card);
      border: 1px solid var(--p-card-border);
      box-shadow: var(--p-card-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--p-primary);
      transition: transform 0.14s ease, background-color 0.14s ease;
    }

    .quick-btn:hover .quick-icon-disc {
      transform: translateY(-1px);
    }

    .quick-btn.is-active .quick-icon-disc {
      background: var(--p-primary);
      color: var(--p-on-primary);
      border-color: transparent;
    }

    .quick-label {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.15;
      color: var(--p-ink);
      text-align: center;
    }

    /* Editorial Split Hero Banner (Redesign) */
    .hero-wrap {
      padding: 8px 16px 0;
    }

    .editorial-banner {
      height: 152px;
      border-radius: 16px;
      background: var(--p-hero-bg);
      color: var(--p-hero-ink);
      position: relative;
      overflow: hidden;
      display: flex;
      box-shadow: 0 8px 22px rgba(11, 24, 61, 0.16);
    }

    .editorial-left {
      width: 56%;
      padding: 12px 8px 24px 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      z-index: 3;
    }

    .editorial-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 6px;
      background: var(--p-hero-eyebrow-bg);
      color: var(--p-hero-eyebrow-fg);
      margin-bottom: 5px;
    }

    .editorial-title {
      margin: 0 0 7px;
      font-size: 16.5px;
      font-weight: 800;
      line-height: 1.14;
      letter-spacing: -0.025em;
      color: #ffffff;
    }

    .editorial-cta {
      min-height: 44px;
      padding: 0 13px;
      border-radius: 999px;
      border: 0;
      background: var(--p-gold);
      color: var(--p-gold-ink);
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    }

    .editorial-right {
      width: 44%;
      position: relative;
      height: 100%;
      overflow: hidden;
    }

    .editorial-right img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 54% 22%;
      display: block;
    }

    /* Narrow 20% left-edge feather only — faces stay 100% clear */
    .editorial-right::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--p-hero-bg) 0%, color-mix(in srgb, var(--p-hero-bg) 0%, transparent) 22%);
      pointer-events: none;
      z-index: 2;
    }

    .banner-dots-overlay {
      position: absolute;
      left: 10px;
      bottom: 2px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .banner-dot-hit {
      min-width: 24px;
      min-height: 24px;
      padding: 0 2px;
      border: 0;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .banner-dot-pill {
      height: 4px;
      width: 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      transition: all 0.18s ease;
    }

    .banner-dot-hit.active .banner-dot-pill {
      width: 18px;
      background: var(--p-gold);
    }

    .banner-arrows-overlay {
      position: absolute;
      right: 6px;
      bottom: 4px;
      z-index: 4;
      display: inline-flex;
      gap: 4px;
    }

    .banner-nav-btn {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(13, 31, 79, 0.56);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    /* Before Banner (White-Fog + Dead Footer Strip) */
    .before-banner-card {
      margin: 14px 16px 0;
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #dce2ee;
    }

    .before-banner-stage {
      height: 188px;
      position: relative;
      overflow: hidden;
    }

    .before-banner-stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: right center;
      display: block;
    }

    .before-banner-fog {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #ffffff 0%, #ffffff 50%, rgba(255, 255, 255, 0.3) 85%, rgba(255, 255, 255, 0.02) 100%);
    }

    .before-banner-copy {
      position: relative;
      z-index: 2;
      width: 64%;
      padding: 16px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .before-banner-tag {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.9px;
      color: rgba(0, 11, 136, 0.85);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 8px;
    }

    .before-banner-h {
      margin: 0 0 14px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.45px;
      color: #000b88;
    }

    .before-banner-cta {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 24px;
      background: #fff4d1;
      color: #000b88;
      font-size: 12.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
    }

    .before-banner-footer {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: rgba(0, 11, 136, 0.8);
    }

    .before-dots {
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .before-dot {
      height: 4px;
      width: 8px;
      border-radius: 2px;
      background: rgba(0, 11, 136, 0.3);
    }

    .before-dot.active {
      width: 24px;
      background: #000b88;
    }

    /* Category Circles Strip */
    .cat-strip-wrap {
      padding: 10px 0 4px;
    }

    .cat-strip {
      display: flex;
      gap: 6px;
      padding: 0 14px;
      overflow-x: auto;
    }

    .cat-strip::-webkit-scrollbar {
      display: none;
    }

    .cat-item {
      width: 78px;
      flex-shrink: 0;
      background: transparent;
      border: 0;
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: var(--p-ink);
    }

    .cat-circle {
      width: 64px;
      height: 64px;
      border-radius: 999px;
      padding: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid transparent;
      transition: all 0.16s ease;
    }

    .cat-circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .cat-item.active .cat-circle {
      border-color: var(--p-primary);
      box-shadow: 0 4px 12px rgba(15, 61, 158, 0.18);
      transform: translateY(-1px);
    }

    .cat-label {
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.22;
      text-align: center;
      color: var(--p-ink);
    }

    .cat-item.active .cat-label {
      color: var(--p-primary);
      font-weight: 800;
    }

    /* Before Category Circles */
    .before-cat-circle {
      width: 68px;
      height: 68px;
      border-radius: 999px;
      background: #e4f2fd;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .before-cat-circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Top Deals Showcase Band */
    .deals-band {
      margin: 8px 0 4px;
      padding: 11px 0 13px;
      background: var(--p-deals-band);
      border-top: 1px solid var(--p-deals-border);
      border-bottom: 1px solid var(--p-deals-border);
    }

    .section-head {
      padding: 0 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .section-title-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .section-h {
      margin: 0;
      font-size: 17.5px;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--p-ink);
    }

    .deals-pill {
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--p-sale);
      color: #ffffff;
    }

    .see-all-btn {
      min-height: 36px;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--p-primary);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
    }

    .deals-rail {
      display: flex;
      gap: 10px;
      padding: 0 16px;
      overflow-x: auto;
    }

    .deals-rail::-webkit-scrollbar {
      display: none;
    }

    /* Product Cards (Grid & Rail) */
    .products-section {
      padding: 16px 16px 12px;
    }

    .products-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .products-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--p-muted);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .product-card {
      background: var(--p-card);
      border: 1px solid var(--p-card-border);
      border-radius: var(--p-card-radius);
      box-shadow: var(--p-card-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .deals-rail .product-card {
      width: 172px;
      flex-shrink: 0;
    }

    .card-photo-plate {
      aspect-ratio: 1 / 0.72;
      background: #ffffff;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.05);
    }

    .card-badge-sale {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--p-sale);
      color: #ffffff;
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
    }

    .card-badge-rx {
      position: absolute;
      left: 8px;
      bottom: 8px;
      background: var(--p-rx-bg);
      color: var(--p-rx-fg);
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
      letter-spacing: 0.02em;
    }

    .card-body {
      padding: 10px 10px 9px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-generic {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--p-muted);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-title {
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.28;
      color: var(--p-ink);
      margin: 0 0 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta-line {
      font-size: 11px;
      font-weight: 600;
      color: var(--p-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }

    .card-footer {
      margin-top: auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
    }

    .card-price-now {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--p-ink);
      line-height: 1.1;
    }

    .card-price-now.on-sale {
      color: var(--p-sale);
    }

    .card-price-was {
      font-size: 11px;
      font-weight: 600;
      color: var(--p-muted);
      text-decoration: line-through;
      margin-top: 2px;
    }

    /* 48x48 Tactile Cart Button (Redesign) */
    .tactile-cart-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: 0;
      background: var(--p-btn-bg);
      color: var(--p-btn-fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;

      transition: transform 0.12s ease, background-color 0.15s ease;

      background: var(--p-btn-active-bg);
      color: var(--p-btn-active-fg);

      position: absolute;
      top: 4px;
      right: 4px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--p-gold);
      color: var(--p-gold-ink);
      font-size: 9.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .before-cart-btn {
      width: 40px;
      height: 40px;
      border: 0;
      background: transparent;
      color: #000b88;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    /* Bottom Navigation Bar (68dp) */
    .bottom-nav {
      height: 68px;
      background: var(--p-nav-bg);
      border-top: 1px solid var(--p-nav-border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 4px 6px 6px;
      flex-shrink: 0;
    }

    .nav-item {
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      color: var(--p-muted);
      position: relative;
    }

    .nav-pill {
      width: 56px;
      height: 30px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background-color 0.16s ease;
    }

    .nav-item.active .nav-pill {
      background: var(--p-nav-pill);
      color: var(--p-nav-active);
    }

    .nav-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--p-muted);
    }

    .nav-item.active .nav-label {
      font-weight: 800;
      color: var(--p-nav-active);
    }

    .nav-badge {
      position: absolute;
      top: 0;
      right: 6px;
      min-width: 18px;
      height: 16px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--p-sale);
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--p-nav-bg);
    }

    .phone-screen[data-option="before"] .nav-badge {
      background: #000b88;
    }

    .phone-toast {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 78px;
      background: #0f172a;
      color: #ffffff;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.18s ease;
      z-index: 35;
    }

    .phone-toast.visible {
      opacity: 1;
      transform: translateY(0);

    .inspector-panel {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--studio-border);
      border-radius: 16px;
      padding: 18px;

      flex-direction: column;
      gap: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);

    }

    .inspector-card {
      background: rgba(11, 17, 32, 0.65);
      border: 1px solid var(--studio-border);
      border-radius: 12px;
      padding: 14px;

      flex-direction: column;
      gap: 10px;

      margin: 0;

      letter-spacing: 0.06em;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .swatch-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .swatch-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 9px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .swatch-chip {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    .swatch-meta {
      min-width: 0;
    }

    .swatch-name {
      font-size: 11px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .swatch-hex {
      font-size: 10.5px;
      color: var(--studio-muted);
    }

    .contrast-table {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .contrast-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.025);
    }

    .contrast-badge {
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .c-pass {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
    }

    .c-fail {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
    }

    .audit-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .audit-item {

    function getVisibleProducts() {
      return PRODUCTS.filter(p => {
        if (state.dealsOnly && p.discount === 0) return false;
        if (state.selectedCategory && p.category !== state.selectedCategory) return false;
        return true;
      });
    }

    function totalCartCount() {
      return Object.values(state.cart).reduce((acc, v) => acc + v, 0);
    }

    function renderProductCard(p, option, isRail = false) {
      const isBefore = option === 'before';
      const qty = state.cart[p.id] || 0;
      const ratingHtml = p.rating
        ? `<div class="card-meta-line">

             <strong style="color:var(--p-ink);font-weight:800;">${p.rating.toFixed(1)}</strong>

        : isBefore
          ? `<div class="card-meta-line">
               ${svgIcon('starOutline', 12, '#94a3b8')}${svgIcon('starOutline', 12, '#94a3b8')}${svgIcon('starOutline', 12, '#94a3b8')}${svgIcon('starOutline', 12, '#94a3b8')}${svgIcon('starOutline', 12, '#94a3b8')}
               <span>No reviews</span>

          : `<div class="card-meta-line">${p.pack}</div>`;

      const cartBtn = isBefore
        ? `<button type="button" class="before-cart-btn" data-touch="true" data-touch-bad="true" data-size="40×40" aria-label="Add ${p.name} to cart" onclick="addToCart('${p.id}')">

        : `<button type="button" class="tactile-cart-btn ${qty > 0 ? 'has-qty' : ''}" data-touch="true" data-size="48×48" aria-label="Add ${p.name} to cart" onclick="addToCart('${p.id}')">
             ${svgIcon('totePlus', 21, 'currentColor')}
             ${qty > 0 ? `<span class="cart-qty-pip tabular">${qty}</span>` : ''}
           </button>`;

      return `
        <article class="product-card">
          <div class="card-photo-plate">
            ${productIllustrationSvg(p)}
            ${p.discount > 0 ? `<span class="card-badge-sale tabular">-${p.discount}%</span>` : ''}

              </div>
              ${cartBtn}
            </div>
          </div>
        </article>
      `;

              </div>
              <div class="editorial-right">
                <img src="${banner.img}" alt="${banner.title}" style="object-position:${banner.pos};" />
              </div>
              <div class="banner-dots-overlay" role="tablist" aria-label="Hero slide indicator">
                ${BANNERS.map((b, idx) => `
                  <button type="button" class="banner-dot-hit ${idx === state.bannerIndex ? 'active' : ''}" aria-label="Show slide ${idx + 1}: ${b.eyebrow}" onclick="setBanner(${idx})">
                    <span class="banner-dot-pill"></span>
                  </button>
                `).join('')}
              </div>
              <div class="banner-arrows-overlay">
                <button type="button" class="banner-nav-btn" aria-label="Previous slide" onclick="stepBanner(-1)">${svgIcon('chevLeft', 14, '#ffffff')}</button>
                <button type="button" class="banner-nav-btn" aria-label="Next slide" onclick="stepBanner(1)">${svgIcon('chevRight', 14, '#ffffff')}</button>
              </div>
            </div>
          </div>
        `;

      const categoryStrip = `
        <div class="cat-strip-wrap">
          <div class="cat-strip">
            ${CATEGORIES.map(c => {
              const active = state.selectedCategory === c.slug;
              return `
                <button type="button" class="cat-item ${active ? 'active' : ''}" data-touch="true" data-size="64×88" onclick="selectCategory('${c.slug}')">
                  <span class="${isBefore ? 'before-cat-circle' : 'cat-circle'}" style="${isBefore ? '' : `background:${c.tint};`}">
                    <img src="${c.img}" alt="${c.name}" />
                  </span>
                  <span class="cat-label">${c.name}</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;

      const dealsShowcase = (!isBefore && !state.dealsOnly && !state.selectedCategory)
        ? `
          <section class="deals-band">
            <div class="section-head">
              <div class="section-title-row">
                <h2 class="section-h">Top deals</h2>
                <span class="deals-pill">Up to 25% off</span>
              </div>
              <button type="button" class="see-all-btn" onclick="toggleDeals()">See all</button>
            </div>
            <div class="deals-rail">
              ${dealProducts.map(p => renderProductCard(p, option, true)).join('')}
            </div>
          </section>
        `
        : '';

      const filterBanner = (!isBefore && (state.selectedCategory || state.dealsOnly))
        ? `
          <div class="active-filter-bar visible">
            <span>Showing: ${headingText} (${products.length})</span>
            <button type="button" class="clear-filter-btn" onclick="clearFilters()">Show all</button>
          </div>
        `
        : '';

      const dockedPills = !isBefore
        ? `
          <div class="docked-pills-bar" data-docked-pills="${roleId}">
            <button type="button" class="cat-pill-chip ${!state.selectedCategory && !state.dealsOnly ? 'active' : ''}" onclick="clearFilters()">
              <span class="cat-pill-thumb">${svgIcon('allGrid', 15, 'currentColor')}</span>
              <span>All</span>
            </button>
            ${CATEGORIES.map(c => `
              <button type="button" class="cat-pill-chip ${state.selectedCategory === c.slug ? 'active' : ''}" onclick="selectCategory('${c.slug}')">
                <span class="cat-pill-thumb"><img src="${c.img}" alt="" /></span>
                <span>${c.name}</span>
              </button>
            `).join('')}
          </div>
        `
        : '';

      return `
        <div class="phone-bezel">
          <div class="phone-screen ${activeDark ? 'is-dark' : ''}" data-option="${option}" data-phone="${roleId}">
            <div class="phone-status">
              <span class="tabular">11:01</span>
              <span class="status-icons">
                <span>5G</span>
                <span>98%</span>
              </span>
            </div>

            <div class="shop-header ${isBefore ? '' : 'redesign-header'}" data-header="${roleId}">
              <div class="header-expandable" data-header-exp="${roleId}">
                ${headerExpandedContent}
              </div>
              <button type="button" class="search-pill" data-touch="true" data-size="48dp" onclick="showPhoneToast('Opening Search screen (/search)')">
                ${svgIcon('search', 18, isBefore ? '#000b88' : 'var(--p-primary)')}
                <span data-search-hint>${SEARCH_HINTS[state.searchHintIndex]}</span>
                ${!isBefore ? `<span class="search-pill-badge">OTC &amp; Rx</span>` : ''}
              </button>
              ${beforeTilesUnderSearch}
            </div>

            ${dockedPills}

            <div class="phone-feed" data-feed="${roleId}" onscroll="onPhoneFeedScroll(this, '${roleId}')">
              ${bannerBlock}
              ${categoryStrip}
              ${filterBanner}
              ${dealsShowcase}

              <section class="products-section">
                <div class="products-head">
                  <h2 class="section-h">${headingText}</h2>
                  <span class="products-count tabular">${products.length} ${products.length === 1 ? 'product' : 'products'}</span>
                </div>
                <div class="products-grid">
                  ${products.map(p => renderProductCard(p, option, false)).join('')}
                </div>
              </section>
            </div>

            <div class="phone-toast" id="phone-toast-${roleId}"></div>

            <nav class="bottom-nav" aria-label="App navigation">
              <button type="button" class="nav-item active" onclick="showPhoneToast('Shop tab active')">
                <span class="nav-pill">${svgIcon('homeFill', 20, 'currentColor')}</span>
                <span class="nav-label">Shop</span>
              </button>
              <button type="button" class="nav-item" onclick="showPhoneToast('Orders tab')">
                <span class="nav-pill">${svgIcon('receipt', 20, 'currentColor')}</span>
                <span class="nav-label">Orders</span>
              </button>
              <button type="button" class="nav-item" onclick="showPhoneToast('Messages tab')">
                <span class="nav-pill">${svgIcon('chat', 20, 'currentColor')}</span>
                <span class="nav-label">Messages</span>
              </button>
              <button type="button" class="nav-item" onclick="showPhoneToast('Cart: ${cartCount} items')">
                <span class="nav-pill">
                  ${svgIcon('tote', 20, 'currentColor')}
                  ${cartCount > 0 ? `<span class="nav-badge tabular">${cartCount}</span>` : ''}
                </span>
                <span class="nav-label">Cart</span>
              </button>
              <button type="button" class="nav-item" onclick="showPhoneToast('Account tab')">
                <span class="nav-pill">${svgIcon('user', 20, 'currentColor')}</span>
                <span class="nav-label">Account</span>
              </button>
            </nav>
          </div>
        </div>
      `;
    }

    function renderInspector() {
      const opt = state.direction;
      const meta = DIRECTION_META[opt];
      const modeKey = state.dark ? 'dark' : 'light';
      const spec = meta[modeKey] || meta.light;
      const isBefore = opt === 'before';

      return `
        <div class="inspector-card">
          <h2 class="inspector-h">
            <span>${meta.name}</span>
            <span style="color:var(--studio-gold);">${state.dark ? 'Dark Scheme' : 'Light Scheme'}</span>
          </h2>
          <div class="swatch-list">
            ${spec.swatches.map(s => `
              <div class="swatch-row">
                <span class="swatch-chip" style="background:${s.hex.startsWith('#') ? s.hex : '#334155'};"></span>
                <div class="swatch-meta">
                  <div class="swatch-name">${s.name}</div>
                  <div class="swatch-hex mono">${s.hex}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="inspector-card">
          <h2 class="inspector-h">
            <span>WCAG 2.1 Contrast Audit</span>
            <span style="font-size:10.5px;color:var(--studio-muted);">AA ≥ 4.5:1</span>
          </h2>
          <div class="contrast-table">
            ${spec.contrasts.map(c => `
              <div class="contrast-row">
                <span>${c.pair}</span>
                <span class="contrast-badge ${c.pass ? 'c-pass' : 'c-fail'} tabular">${c.ratio} ${c.pass ? 'PASS' : 'FAIL'}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="inspector-card">
          <h2 class="inspector-h">
            <span>${isBefore ? 'Identified Audit Gaps' : 'Audit Improvements Applied'}</span>
          </h2>
          <ul class="audit-list">
            ${meta.fixes.map(f => `
              <li class="audit-item">
                <span class="audit-dot ${isBefore ? 'warn' : ''}">${isBefore ? '!' : svgIcon('check', 11, 'currentColor')}</span>
                <span>${f}</span>
              </li>
            `).join('')}
          </ul>
        </div>

        <div class="inspector-card">
          <h2 class="inspector-h">
            <span>Design Scorecard (Before → Redesign)</span>
          </h2>
          <div class="contrast-table">
            <div class="contrast-row">
              <span>Above-the-fold canopy + hero footprint</span>
              <span class="contrast-badge ${isBefore ? 'c-fail' : 'c-pass'} tabular">${isBefore ? '~630dp (cards hidden)' : '~455dp (deals visible)'}</span>
            </div>
            <div class="contrast-row">
              <span>Card Add-to-Cart touch target (Android ≥ 48dp)</span>
              <span class="contrast-badge ${isBefore ? 'c-fail' : 'c-pass'} tabular">${isBefore ? '40×40dp bare icon' : '48×48dp tactile pill'}</span>
            </div>
            <div class="contrast-row">
              <span>Hero photography clarity</span>
              <span class="contrast-badge ${isBefore ? 'c-fail' : 'c-pass'}">${isBefore ? '85% white fog mask' : 'Clean 56/44 editorial split'}</span>
            </div>
            <div class="contrast-row">
              <span>Dark Mode parity (MaterialApp.darkTheme)</span>
              <span class="contrast-badge ${isBefore ? 'c-fail' : 'c-pass'}">${isBefore ? 'Not wired in app.dart' : 'Full Light + Dark tokens'}</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderAll() {
      const workspace = document.getElementById('stage-workspace');
      const cluster = document.getElementById('phones-cluster');
      const inspector = document.getElementById('inspector-panel');
      const compare = state.viewMode === 'compare';

      workspace.classList.toggle('compare-mode', compare);

      if (compare) {
        const afterOption = state.direction === 'before' ? state.lastRedesign : state.direction;
        cluster.innerHTML = `
          <div class="phone-column">
            <div class="phone-caption">
              <span>Current Homepage</span>
              <span class="caption-chip before">Before · Washed Sky</span>
            </div>
            ${renderPhone('before', 'before')}
          </div>
          <div class="phone-column">
            <div class="phone-caption">
              <span>${DIRECTION_META[afterOption].name}</span>
              <span class="caption-chip">After · Redesigned</span>
            </div>
            ${renderPhone(afterOption, 'after')}
          </div>
        `;
      } else {
        cluster.innerHTML = `
          <div class="phone-column">
            <div class="phone-caption">
              <span>${DIRECTION_META[state.direction].name}</span>
              <span class="caption-chip ${state.direction === 'before' ? 'before' : ''}">${state.dark ? 'Dark Theme' : 'Light Theme'}</span>
            </div>
            ${renderPhone(state.direction, 'main')}
          </div>
        `;
        inspector.innerHTML = renderInspector();
      }

      document.body.classList.toggle('touch-debug', state.touchDebug);
      applyCollapseVisuals(state.collapsePct);
      syncHeaderButtons();
    }

    function syncHeaderButtons() {
      document.querySelectorAll('.dir-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.dir === state.direction);
      });
      document.getElementById('mode-explorer').classList.toggle('active', state.viewMode === 'explorer');
      document.getElementById('mode-compare').classList.toggle('active', state.viewMode === 'compare');

      const themeBtn = document.getElementById('btn-theme');
      themeBtn.classList.toggle('active', state.dark);
      document.getElementById('theme-icon').innerHTML = svgIcon(state.dark ? 'moon' : 'sun', 14, 'currentColor');
      document.getElementById('theme-label').textContent = state.dark ? 'Dark Mode: On' : 'Dark Mode: Off';

      document.getElementById('btn-touch').classList.toggle('active', state.touchDebug);
      document.getElementById('collapse-slider').value = state.collapsePct;
      document.getElementById('collapse-pct').textContent = `${state.collapsePct}%`;
    }

    function applyCollapseVisuals(pct) {
      const t = pct / 100;
      document.querySelectorAll('[data-header-exp]').forEach(exp => {
        if (!exp.dataset.baseHeight) {
          exp.dataset.baseHeight = exp.scrollHeight || 88;
        }
        const base = Number(exp.dataset.baseHeight);
        exp.style.height = `${Math.max(0, base * (1 - t))}px`;
        exp.style.opacity = `${Math.max(0, 1 - t * 1.6)}`;
        exp.style.pointerEvents = t > 0.45 ? 'none' : 'auto';
      });
      document.querySelectorAll('[data-header]').forEach(hdr => {
        const isRedesign = hdr.classList.contains('redesign-header');
        if (isRedesign) {
          hdr.classList.toggle('flat-bottom', t >= 0.45);
        }
      });
      document.querySelectorAll('[data-docked-pills]').forEach(pills => {
        pills.classList.toggle('visible', t >= 0.45);
      });
    }

    let syncingScroll = false;

    function onPhoneFeedScroll(el, roleId) {
      const maxRange = 96;
      const pct = Math.round(Math.min(1, el.scrollTop / maxRange) * 100);
      if (pct !== state.collapsePct) {
        state.collapsePct = pct;
        document.getElementById('collapse-slider').value = pct;
        document.getElementById('collapse-pct').textContent = `${pct}%`;
        applyCollapseVisuals(pct);
      }
      if (state.viewMode === 'compare' && !syncingScroll) {
        syncingScroll = true;
        document.querySelectorAll('.phone-feed').forEach(other => {
          if (other !== el) {
            other.scrollTop = el.scrollTop;
          }
        });
        requestAnimationFrame(() => { syncingScroll = false; });
      }
    }

    function onScrubCollapse(val) {
      state.collapsePct = Number(val);
      document.getElementById('collapse-pct').textContent = `${state.collapsePct}%`;
      const targetScroll = (state.collapsePct / 100) * 96;
      syncingScroll = true;
      document.querySelectorAll('.phone-feed').forEach(el => {
        el.scrollTop = targetScroll;
      });
      applyCollapseVisuals(state.collapsePct);
      requestAnimationFrame(() => { syncingScroll = false; });
    }

    function jumpCollapse(pct) {
      onScrubCollapse(pct);
    }

    function setDirection(dir) {
      state.direction = dir;
      if (dir !== 'before') {
        state.lastRedesign = dir;
      }
      renderAll();
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      renderAll();
    }

    function toggleTheme() {
      state.dark = !state.dark;
      renderAll();
    }

    function toggleTouchDebug() {
      state.touchDebug = !state.touchDebug;
      renderAll();
    }

    function setBanner(idx) {
      state.bannerIndex = idx;
      renderAll();
    }

    function stepBanner(delta) {
      state.bannerIndex = (state.bannerIndex + delta + BANNERS.length) % BANNERS.length;
      renderAll();
    }

    function triggerBannerAction() {
      const b = BANNERS[state.bannerIndex];
      if (b.actionType === 'category') {
        state.dealsOnly = false;
        state.selectedCategory = b.actionTarget;
        renderAll();
        showPhoneToast(`Filtered by ${CATEGORIES.find(c => c.slug === b.actionTarget).name}`);
      } else if (b.actionType === 'deals') {
        state.selectedCategory = null;
        state.dealsOnly = true;
        renderAll();
        showPhoneToast('Showing Top Deals');
      } else {
        showPhoneToast(b.actionTarget);
      }
    }

    function selectCategory(slug) {
      state.dealsOnly = false;
      state.selectedCategory = state.selectedCategory === slug ? null : slug;
      renderAll();
    }

    function toggleDeals() {
      state.selectedCategory = null;
      state.dealsOnly = !state.dealsOnly;
      renderAll();
    }

    function clearFilters() {
      state.selectedCategory = null;
      state.dealsOnly = false;
      renderAll();
    }

    function addToCart(id) {
      state.cart[id] = (state.cart[id] || 0) + 1;
      const prod = PRODUCTS.find(p => p.id === id);
      renderAll();
      showPhoneToast(`Added ${prod.name} to cart (${state.cart[id]} in cart)`);
    }

    function resetDemo() {
      state.selectedCategory = null;
      state.dealsOnly = false;
      state.cart = { paracetamol: 2 };
      state.bannerIndex = 0;
      state.collapsePct = 0;
      renderAll();
    }

    function showPhoneToast(msg) {
      document.querySelectorAll('.phone-toast').forEach(el => {
        el.textContent = msg;
        el.classList.add('visible');
      });
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => {
        document.querySelectorAll('.phone-toast').forEach(el => {
          el.classList.remove('visible');
        });
      }, 2200);
    }

    setInterval(() => {
      state.searchHintIndex = (state.searchHintIndex + 1) % SEARCH_HINTS.length;
      document.querySelectorAll('[data-search-hint]').forEach(el => {
        el.textContent = SEARCH_HINTS[state.searchHintIndex];
      });
    }, 3000);

    renderAll();
  </script>
</body>
</html>
