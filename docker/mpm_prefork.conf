# Sized for Render's 512 MB Starter instance: each Laravel worker takes ~30-50 MB, so the
# Apache default of 150 workers exhausted memory under bursts and froze the container.
# Extra requests now wait in the listen queue instead of spawning workers that cannot fit.
# shortcut: fixed for 512 MB; raise MaxRequestWorkers (~RAM / 50 MB) on a bigger instance or VPS.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        10
    # Recycle workers so slow memory growth in long-lived PHP processes cannot accumulate.
    MaxConnectionsPerChild   500
</IfModule>

# The default 300s lets a stalled client hold one of the few workers for five minutes.
Timeout 60
KeepAliveTimeout 2
