name: jmmart

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    networks:
      - frontend

  app:
    build:
      context: .
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
    image: ${APP_IMAGE:-jmmart:latest}
    env_file: ${ENV_FILE:-.env.production}
    environment:
      # Apache listens on this port; Caddy and the healthcheck both use port 80.
      PORT: "80"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/up\") === false ? 1 : 0);'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - frontend
      - backend

  queue:
    image: ${APP_IMAGE:-jmmart:latest}
    user: www-data
    env_file: ${ENV_FILE:-.env.production}
    command: php artisan queue:work redis --tries=3 --max-time=3600 --sleep=3
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - frontend
      - backend

  scheduler:
    image: ${APP_IMAGE:-jmmart:latest}
    user: www-data
    env_file: ${ENV_FILE:-.env.production}
    command: php artisan schedule:work
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend

  reverb:
    image: ${APP_IMAGE:-jmmart:latest}
    user: www-data
    env_file: ${ENV_FILE:-.env.production}
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - frontend
      - backend

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >-
      sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend

volumes:
  app-storage:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:

networks:
  frontend:
  backend:
    internal: true
